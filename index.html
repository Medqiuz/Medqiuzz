<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a74da">
  <title>MedQuiz | Student Registration</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:20px;background:#f3f6fb;font-family:Arial,sans-serif;color:#172033;min-height:100vh;display:grid;place-items:center}.card{width:100%;max-width:520px;background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 30px #152b4b18}.brand{text-align:center;color:#1769aa;margin:0 0 8px}.muted{text-align:center;color:#637083;margin:0 0 22px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:#f7f9fc;color:#234;cursor:pointer}.tabs button.active{background:#1769aa;color:white;border-color:#1769aa}form{display:grid;gap:11px}input,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;background:white}input:focus,select:focus{outline:2px solid #b6d9fa;border-color:#1769aa}.primary{width:100%;padding:14px;border:0;border-radius:9px;background:#1769aa;color:white;font-size:16px;font-weight:bold;cursor:pointer}.primary:disabled{opacity:.6;cursor:wait}.message{display:none;margin-top:14px;padding:12px;border-radius:8px;line-height:1.45;overflow-wrap:anywhere}.success{display:block;background:#e8f7ed;color:#155b2b}.error{display:block;background:#fff0f0;color:#8b1e1e}.note{font-size:13px;line-height:1.5;color:#596579;margin-top:14px}.hidden{display:none!important}a{color:#1769aa}
  </style>
</head>
<body>
  <main class="card">
    <h1 class="brand">MedQuiz</h1>
    <p class="muted">Secure student registration and login</p>
    <div class="tabs">
      <button id="show-register" class="active" type="button">Register</button>
      <button id="show-login" type="button">Login</button>
    </div>

    <form id="register-form">
      <input id="fullName" type="text" maxlength="100" placeholder="Full name" autocomplete="name" required>
      <input id="phone" type="tel" maxlength="25" placeholder="Phone number" autocomplete="tel" required>
      <input id="university" type="text" maxlength="120" placeholder="University" required>
      <select id="department" required>
        <option value="" disabled selected>Select department</option>
        <option>Medicine</option><option>Pharmacy</option><option>Nursing</option>
        <option>Medical Laboratory</option><option>Public Health</option><option>Physiotherapy</option>
        <option>Radiology</option><option>Nutrition</option><option>Other</option>
      </select>
      <select id="year" required>
        <option value="" disabled selected>Select year</option>
        <option value="1">Year 1</option><option value="2">Year 2</option><option value="3">Year 3</option>
        <option value="4">Year 4</option><option value="5">Year 5</option><option value="6">Year 6</option>
        <option value="Postgraduate">Postgraduate</option>
      </select>
      <select id="section" required>
        <option value="" disabled selected>Select section</option>
        <option>A</option><option>B</option><option>C</option>
      </select>
      <input id="register-email" type="email" maxlength="254" placeholder="Email address" autocomplete="email" required>
      <input id="register-password" type="password" minlength="8" maxlength="128" placeholder="Create password (at least 8 characters)" autocomplete="new-password" required>
      <input id="code" type="text" minlength="12" maxlength="12" placeholder="12-character access code" autocapitalize="characters" autocomplete="off" required>
      <button id="register-btn" class="primary" type="submit">Complete registration</button>
    </form>

    <form id="login-form" class="hidden">
      <input id="login-email" type="email" placeholder="Email address" autocomplete="username" required>
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button id="login-btn" class="primary" type="submit">Login</button>
    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>
    <p class="note">Your password is handled by Firebase Authentication and is not saved in your student profile. Never share your password or access code. Need an access code? Contact the official MedQuiz administrator.</p>
  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
    import { collection, doc, getDoc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    const registerForm = $("register-form");
    const loginForm = $("login-form");
    const message = $("message");
    let busy = false;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }
    function setBusy(button, value, label) {
      button.disabled = value;
      button.textContent = value ? "Please wait…" : label;
      busy = value;
    }
    function showTab(tab) {
      const registering = tab === "register";
      registerForm.classList.toggle("hidden", !registering);
      loginForm.classList.toggle("hidden", registering);
      $("show-register").classList.toggle("active", registering);
      $("show-login").classList.toggle("active", !registering);
      message.className = "message";
    }
    $("show-register").addEventListener("click", () => showTab("register"));
    $("show-login").addEventListener("click", () => showTab("login"));

    async function obtainAccount(email, password) {
      if (auth.currentUser && auth.currentUser.email?.toLowerCase() === email) return auth.currentUser;
      if (auth.currentUser) await signOut(auth);
      try {
        const credential = await createUserWithEmailAndPassword(auth, email, password);
        return credential.user;
      } catch (error) {
        if (error.code === "auth/email-already-in-use") {
          const credential = await signInWithEmailAndPassword(auth, email, password);
          return credential.user;
        }
        throw error;
      }
    }

    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy || !registerForm.reportValidity()) return;
      const button = $("register-btn");
      setBusy(button, true, "Complete registration");
      message.className = "message";
      try {
        const fullName = $("fullName").value.trim();
        const phone = $("phone").value.trim();
        const university = $("university").value.trim();
        const department = $("department").value;
        const year = $("year").value;
        const section = $("section").value;
        const email = $("register-email").value.trim().toLowerCase();
        const password = $("register-password").value;
        const code = $("code").value.trim().toUpperCase();

        if (!/^[A-HJ-NP-Z2-9]{12}$/.test(code)) {
          throw new Error("Access code must contain exactly 12 characters. Check the code and try again.");
        }
        const user = await obtainAccount(email, password);
        const studentRef = doc(db, "students", user.uid);
        const codeRef = doc(db, "accessCodes", code);

        const existing = await getDoc(studentRef);
        if (existing.exists()) {
          showMessage("This account is already registered. Use the Login tab.", "error");
          return;
        }

        await runTransaction(db, async (transaction) => {
          const codeSnapshot = await transaction.get(codeRef);
          if (!codeSnapshot.exists() || codeSnapshot.data().used !== false) {
            throw new Error("Access code is invalid or has already been used.");
          }
          transaction.update(codeRef, {
            used: true,
            uid: user.uid,
            email,
            redeemedAt: serverTimestamp()
          });
          transaction.set(studentRef, {
            uid: user.uid,
            fullName,
            phone,
            university,
            department,
            year,
            section,
            email,
            redeemedCode: code,
            registrationDate: serverTimestamp()
          });
        });

        showMessage("Registration successful. Opening your MedQuiz dashboard…", "success");
        setTimeout(() => { window.location.href = "dashboard.html"; }, 900);
      } catch (error) {
        console.error("Registration error:", error);
        const messages = {
          "auth/weak-password": "Choose a password with at least 8 characters.",
          "auth/invalid-email": "Enter a valid email address.",
          "auth/invalid-credential": "This email already has an account. Check your password in the Login tab.",
          "permission-denied": "Registration was blocked by database security rules. Check that the latest Firestore rules were published and that this access code is valid and unused."
        };
        showMessage(messages[error.code] || error.message || "Registration failed. Please try again.", "error");
      } finally {
        setBusy(button, false, "Complete registration");
      }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy || !loginForm.reportValidity()) return;
      const button = $("login-btn");
      setBusy(button, true, "Login");
      message.className = "message";
      try {
        const email = $("login-email").value.trim().toLowerCase();
        const password = $("login-password").value;
        const credential = await signInWithEmailAndPassword(auth, email, password);
        const profile = await getDoc(doc(db, "students", credential.user.uid));
        if (!profile.exists()) {
          showTab("register");
          $("register-email").value = email;
          showMessage("Your account exists, but registration is not complete. Fill in your student details and redeem a valid unused access code.", "error");
          return;
        }
        showMessage("Login successful. Opening your dashboard…", "success");
        setTimeout(() => { window.location.href = "dashboard.html"; }, 700);
      } catch (error) {
        console.error("Login error:", error);
        const text = error.code === "auth/invalid-credential" ? "Incorrect email or password." : (error.message || "Login failed.");
        showMessage(text, "error");
      } finally {
        setBusy(button, false, "Login");
      }
    });
  </script>
</body>
</html>
