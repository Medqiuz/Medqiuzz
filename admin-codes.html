<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MedQuiz Admin | Generate Codes</title>
<style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#f3f6fb;font-family:Arial,sans-serif;color:#172033}.box{max-width:650px;margin:auto;background:white;padding:24px;border-radius:14px;box-shadow:0 5px 22px #0001}h1{color:#1769aa}input{width:100%;padding:13px;margin:7px 0;border:1px solid #ccd4df;border-radius:8px;font-size:16px}button{padding:13px 16px;background:#1769aa;color:white;border:0;border-radius:8px;font-weight:bold;margin:6px 5px 6px 0}button:disabled{opacity:.6}#status{display:none;padding:12px;border-radius:8px;margin-top:12px}textarea{width:100%;min-height:220px;padding:12px;border:1px solid #ccd4df;border-radius:8px;margin-top:12px;font-family:monospace}.note{font-size:13px;color:#596579;line-height:1.5}</style></head>
<body><main class="box"><h1>MedQuiz Access-Code Generator</h1><p class="note">Admin-only tool. Newly generated codes are shown once here. Save the downloaded file securely and distribute each code to one student only.</p>
<div id="login-panel"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Admin password"><button id="login">Admin login</button></div>
<section id="generator" hidden><label for="quantity">Number of new codes (1–400)</label><input id="quantity" type="number" min="1" max="400" value="20"><button id="generate">Generate codes</button><button id="copy" disabled>Copy codes</button><button id="download" disabled>Download TXT</button><textarea id="codes" readonly placeholder="Generated codes will appear here. Keep them private."></textarea><button id="logout">Logout</button></section>
<div id="status" role="status"></div></main>
<script type="module">
import {auth,db} from './firebase.js';
import {signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import {doc,getDoc,serverTimestamp,writeBatch} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js';
const $=id=>document.getElementById(id);let latest=[];
function status(t,ok=false){$('status').textContent=t;$('status').style.display='block';$('status').style.background=ok?'#e8f7ed':'#fff0f0';$('status').style.color=ok?'#155b2b':'#8b1e1e'}
function randomCode(){const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const bytes=new Uint8Array(12);crypto.getRandomValues(bytes);return Array.from(bytes,b=>alphabet[b&31]).join('')}
$('login').addEventListener('click',async()=>{try{$('login').disabled=true;const cred=await signInWithEmailAndPassword(auth,$('email').value.trim().toLowerCase(),$('password').value);const admin=await getDoc(doc(db,'admins',cred.user.uid));if(!admin.exists())throw new Error('This account is not an administrator.');$('login-panel').hidden=true;$('generator').hidden=false;status('Admin access granted.',true)}catch(e){console.error(e);if(auth.currentUser)await signOut(auth);status(e.message||'Login failed.')}finally{$('login').disabled=false}});
$('generate').addEventListener('click',async()=>{const n=Number($('quantity').value);if(!Number.isInteger(n)||n<1||n>400){status('Enter a number from 1 to 400.');return}try{$('generate').disabled=true;latest=[];const unique=new Set();while(unique.size<n)unique.add(randomCode());const codes=[...unique];for(let start=0;start<codes.length;start+=400){const batch=writeBatch(db);for(const code of codes.slice(start,start+400)){batch.set(doc(db,'accessCodes',code),{used:false,createdAt:serverTimestamp()})}await batch.commit()}latest=codes;$('codes').value=codes.join('\n');$('copy').disabled=false;$('download').disabled=false;status(`${codes.length} new access codes created. Save them now; this page does not provide a recovery list to students.`,true)}catch(e){console.error(e);status(e.message||'Could not create codes. Check Firestore rules.')}finally{$('generate').disabled=false}});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(latest.join('\n'));status('Codes copied.',true)}catch(e){status('Copy was blocked by the browser. Select the text and copy it manually.')}});
$('download').addEventListener('click',()=>{const blob=new Blob([latest.join('\n')+'\n'],{type:'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='medquiz-new-access-codes.txt';a.click();URL.revokeObjectURL(url)});
$('logout').addEventListener('click',async()=>{await signOut(auth);location.reload()});
</script></body></html>
